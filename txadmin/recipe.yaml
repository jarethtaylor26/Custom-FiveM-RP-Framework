  - action: write_file
    file: ./resources/[framework]/civic_vehicles/client/main.lua
    data: |
      RegisterNetEvent('civic_vehicles:client:list', function(vehicles)
          TriggerEvent('chat:addMessage', {
              color = { 117, 211, 190 },
              args = { 'Vehicles', 'Use /spawnvehicle [number] to retrieve a vehicle.' }
          })
          for index, vehicle in ipairs(vehicles or {}) do
              TriggerEvent('chat:addMessage', {
                  color = { 220, 226, 230 },
                  args = { tostring(index), ('%s  |  %s'):format(vehicle.label or vehicle.model, vehicle.plate or 'No plate') }
              })
          end
      end)
      
      RegisterNetEvent('civic_vehicles:client:spawn', function(modelName, plate)
          local model = joaat(tostring(modelName or ''))
          if not IsModelInCdimage(model) or not IsModelAVehicle(model) then
              TriggerEvent('civic_core:client:notify', 'That vehicle model is unavailable.')
              return
          end
          RequestModel(model)
          local timeout = GetGameTimer() + 10000
          while not HasModelLoaded(model) and GetGameTimer() < timeout do Wait(0) end
          if not HasModelLoaded(model) then
              TriggerEvent('civic_core:client:notify', 'The vehicle model did not load.')
              return
          end
      
          local ped = PlayerPedId()
          local coords = GetOffsetFromEntityInWorldCoords(ped, 0.0, 4.0, 0.0)
          local vehicle = CreateVehicle(model, coords.x, coords.y, coords.z, GetEntityHeading(ped), true, false)
          if vehicle and vehicle ~= 0 then
              SetVehicleNumberPlateText(vehicle, tostring(plate or 'CIVIC'))
              SetPedIntoVehicle(ped, vehicle, -1)
              SetEntityAsMissionEntity(vehicle, true, true)
          end
          SetModelAsNoLongerNeeded(model)
      end)

  - action: write_file
    file: ./resources/[framework]/civic_vehicles/fxmanifest.lua
    data: |
      fx_version 'cerulean'
      game 'gta5'
      lua54 'yes'
      
      name 'civic_vehicles'
      author 'Civic Framework'
      description 'Basic vehicle ownership, purchases, and spawning.'
      version '0.1.0'
      
      shared_scripts {
          'shared/config.lua'
      }
      
      server_scripts {
          'server/main.lua'
      }
      
      client_scripts {
          'client/main.lua'
      }
      
      dependency 'civic_core'

  - action: write_file
    file: ./resources/[framework]/civic_vehicles/server/main.lua
    data: |
      local function notify(source, message)
          exports.civic_core:Notify(source, message)
      end
      
      RegisterCommand('buyvehicle', function(source, args)
          if source == 0 then return end
          local modelName = string.lower(tostring(args[1] or ''))
          local vehicle = CivicVehicleCatalog[modelName]
          if not vehicle then
              notify(source, 'Usage: /buyvehicle [blista|prairie|stanier]')
              return
          end
          local player = exports.civic_core:GetPlayer(source)
          if not player then
              notify(source, 'Your character is still loading.')
              return
          end
          if not exports.civic_core:RemoveMoney(source, 'bank', vehicle.price, 'vehicle purchase') then
              notify(source, 'Not enough money in your bank account.')
              return
          end
          local owned = exports.civic_core:AddVehicle(source, {
              model = modelName,
              label = vehicle.label
          })
          if not owned then
              exports.civic_core:AddMoney(source, 'bank', vehicle.price, 'vehicle purchase refund')
              notify(source, 'Could not save the vehicle purchase; your payment was refunded.')
              return
          end
          exports.civic_core:SavePlayer(source)
          notify(source, ('Purchased %s for $%d. Use /myvehicles to view it.'):format(vehicle.label, vehicle.price))
      end, false)
      
      RegisterCommand('myvehicles', function(source)
          if source == 0 then return end
          local player = exports.civic_core:GetPlayer(source)
          if not player then return end
          if #player.vehicles == 0 then
              notify(source, 'You do not own any vehicles. Use /buyvehicle [model].')
              return
          end
          TriggerClientEvent('civic_vehicles:client:list', source, player.vehicles)
      end, false)
      
      RegisterCommand('spawnvehicle', function(source, args)
          if source == 0 then return end
          local player = exports.civic_core:GetPlayer(source)
          local index = math.floor(tonumber(args[1]) or 0)
          local owned = player and player.vehicles[index]
          if not owned then
              notify(source, 'Usage: /spawnvehicle [number from /myvehicles]')
              return
          end
          TriggerClientEvent('civic_vehicles:client:spawn', source, owned.model, owned.plate)
      end, false)

  - action: write_file
    file: ./resources/[framework]/civic_vehicles/shared/config.lua
    data: |
      CivicVehicleCatalog = {
          blista = { label = 'Blista', price = 12000 },
          prairie = { label = 'Prairie', price = 14500 },
          stanier = { label = 'Stanier', price = 18000 }
      }

