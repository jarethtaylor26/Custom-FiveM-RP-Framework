              }
          }
      }

  - action: write_file
    file: ./resources/[framework]/civic_housing/client/main.lua
    data: |
      local activeHome = nil
      
      RegisterNetEvent('civic_housing:client:list', function(homes)
          TriggerEvent('chat:addMessage', {
              color = { 117, 211, 190 },
              args = { 'Housing', 'Use /enterhome [id] to enter an owned property.' }
          })
          for _, owned in ipairs(homes or {}) do
              local definition = CivicHomes[owned.id]
              TriggerEvent('chat:addMessage', {
                  color = { 220, 226, 230 },
                  args = { owned.id, definition and definition.label or owned.id }
              })
          end
      end)
      
      RegisterNetEvent('civic_housing:client:enter', function(homeId)
          local home = CivicHomes[homeId]
          if not home then return end
          local ped = PlayerPedId()
          SetEntityCoords(ped, home.inside.x, home.inside.y, home.inside.z, false, false, false, false)
          SetEntityHeading(ped, home.inside.w)
          activeHome = homeId
          TriggerEvent('civic_core:client:notify', ('Entered %s. Use /exithome to leave.'):format(home.label))
      end)
      
      RegisterNetEvent('civic_housing:client:exit', function()
          if not activeHome or not CivicHomes[activeHome] then
              TriggerEvent('civic_core:client:notify', 'You are not inside a property.')
              return
          end
          local outside = CivicHomes[activeHome].outside
          local ped = PlayerPedId()
          SetEntityCoords(ped, outside.x, outside.y, outside.z, false, false, false, false)
          SetEntityHeading(ped, outside.w)
          activeHome = nil
      end)

  - action: write_file
    file: ./resources/[framework]/civic_housing/fxmanifest.lua
    data: |
      fx_version 'cerulean'
      game 'gta5'
      lua54 'yes'
      
      name 'civic_housing'
      author 'Civic Framework'
      description 'Starter property ownership and interior access.'
      version '0.1.0'
      
      shared_scripts {
          'shared/config.lua'
      }
      
      server_scripts {
          'server/main.lua'
      }
      
      client_scripts {
          'client/main.lua'
      }
      
      dependency 'civic_core'

  - action: write_file
    file: ./resources/[framework]/civic_housing/server/main.lua
    data: |
      local function notify(source, message)
          exports.civic_core:Notify(source, message)
      end
      
      RegisterCommand('buyhome', function(source, args)
          if source == 0 then return end
          local homeId = string.lower(tostring(args[1] or ''))
          local home = CivicHomes[homeId]
          local player = exports.civic_core:GetPlayer(source)
          if not home then
              notify(source, 'Usage: /buyhome [grove|delperro]')
              return
          end
          if not player then
              notify(source, 'Your character is still loading.')
              return
          end
          for _, owned in ipairs(player.homes or {}) do
              if owned.id == homeId then
                  notify(source, 'You already own this property.')
                  return
              end
          end
          if not exports.civic_core:RemoveMoney(source, 'bank', home.price, 'property purchase') then
              notify(source, 'Not enough money in your bank account.')
              return
          end
          if not exports.civic_core:AddHome(source, homeId) then
              exports.civic_core:AddMoney(source, 'bank', home.price, 'property purchase refund')
              notify(source, 'Could not save the property purchase; your payment was refunded.')
              return
          end
          exports.civic_core:SavePlayer(source)
          notify(source, ('Purchased %s for $%d.'):format(home.label, home.price))
      end, false)
      
      RegisterCommand('myhomes', function(source)
          if source == 0 then return end
          local player = exports.civic_core:GetPlayer(source)
          if not player then return end
          if #player.homes == 0 then
              notify(source, 'You do not own a property. Use /buyhome [grove|delperro].')
              return
          end
          TriggerClientEvent('civic_housing:client:list', source, player.homes)
      end, false)
      
      RegisterCommand('enterhome', function(source, args)
          if source == 0 then return end
          local homeId = string.lower(tostring(args[1] or ''))
          local player = exports.civic_core:GetPlayer(source)
          if not player then return end
          for _, owned in ipairs(player.homes or {}) do
              if owned.id == homeId and CivicHomes[homeId] then
                  TriggerClientEvent('civic_housing:client:enter', source, homeId)
                  return
              end
          end
          notify(source, 'You do not own that property.')
      end, false)
      
      RegisterCommand('exithome', function(source)
          if source == 0 then return end
          TriggerClientEvent('civic_housing:client:exit', source)
      end, false)
      
      RegisterNetEvent('civic_housing:server:requestExit', function()
          TriggerClientEvent('civic_housing:client:exit', source)
      end)

