# Civic Framework starter configuration for txAdmin / FXServer.
# txAdmin fills the server name, endpoint, player slots, and license key during deployment.

{{serverEndpoints}}

sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}}"
sets sv_projectName "Civic Framework"
sets sv_projectDesc "A standalone, modular roleplay framework."
sets tags "roleplay, civic, custom"
sets locale "en-US"

sv_maxclients {{maxClients}}
sv_endpointPrivacy true
sv_scriptHookAllowed 0
set onesync on

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

ensure civic_core
ensure civic_inventory
ensure civic_vehicles
ensure civic_housing

# Grant framework administration to trusted principals only.
# Example: add_ace group.admin civic.admin allow
